name: Cabina

# La CI de la app de escritorio, separada de la del motor.
#
# **Corre en Windows y no es una preferencia.** `keyring` está declarado con la
# feature `windows-native` (`app/src-tauri/Cargo.toml`), así que en Ubuntu la
# app ni siquiera compilaría. Y la app es Windows-only por decisión del punto 14
# del backlog, no por accidente.
#
# **El instalador lo arma un job aparte, y sólo al taguear.** `tauri build`
# compila en release: hacerlo en cada push costaría mucho más que los checks para
# producir un artefacto que nadie va a bajar. Un tag es una decisión explícita de
# publicar, y es la única señal que lo dispara.

on:
  push:
    # Los tags entran acá para que el job del instalador tenga con qué
    # dispararse. **Los `paths` de abajo no se les aplican**: un tag suele
    # apuntar a un commit que no tocó `app/`, y con el filtro el push del tag no
    # dispararía nada. GitHub evalúa `branches` y `tags` por separado.
    tags: ['v*']
    branches: [main, mejoras-post-1.0]
    # Anidado dentro de cada evento: como hermano de `push`, GitHub lo ignora
    # en silencio y el workflow correría siempre creyendo estar filtrado.
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'

concurrency:
  group: cabina-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar la cabina (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Son 483 dependencias en `Cargo.lock`: sin caché, cada corrida
      # recompila el árbol entero de Tauri.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Instalar dependencias del front
        run: npm ci

      # `npm run build` es `tsc && vite build`, así que ya verifica los tipos.
      - name: Tipos y build del front
        run: npm run build

      - name: Formato de Rust
        run: cargo fmt --check
        working-directory: app/src-tauri

      - name: Clippy sin warnings
        run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri

      # Los 5 tests de integración contra el motor real llevan `#[ignore]`, así
      # que esto no necesita contenedores levantados.
      #
      # Los 4 de `secretos.rs` sí hablan con el almacén de credenciales real,
      # contra un servicio propio (`sin-ruido-motor--test`) y con limpieza. En un
      # runner de Windows deberían funcionar; si no, hay que marcarlos
      # `#[ignore]` con el error real anotado y no con una sospecha.
      - name: Tests de Rust
        run: cargo test
        working-directory: app/src-tauri

      # Último a propósito: termina en `git diff --exit-code`, así que conviene
      # que sea lo último que toque el árbol. Falla si alguien cambió un struct
      # de `tipos.rs` y no commiteó los bindings regenerados.
      - name: Los bindings están al día
        run: npm run bindings:check

  instalador:
    name: Armar el instalador (Windows)
    # **Sólo al taguear.** Ver la nota de arriba: un tag es la decisión de
    # publicar, y `tauri build` es demasiado caro para cada push.
    if: startsWith(github.ref, 'refs/tags/v')
    # Que no se publique un instalador de un árbol que no pasa los checks.
    needs: verificar
    runs-on: windows-latest
    # Acotado a este job a proposito: `verificar` sigue en solo lectura. Es lo
    # unico que necesita `gh release create`.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # **El número del tag y el de la app tienen que coincidir.** Motor y app
      # se numeran juntos desde la 1.2.0, y un instalador que dice ser otra
      # versión que su tag es exactamente el par desparejo que esa decisión
      # existe para evitar. Falla acá, antes de compilar veinte minutos.
      - name: El tag coincide con la versión de la app
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          motor=$(grep -oP 'VERSION = "\K[^"]+' ../src/config.py)
          echo "tag=$tag  app=$app  motor=$motor"
          if [ "$tag" != "$app" ] || [ "$tag" != "$motor" ]; then
            echo "::error::El tag ($tag), package.json ($app) y src/config.py ($motor) no coinciden."
            exit 1
          fi
          # **Sin la `v`, que es como Tauri nombra el archivo.** El tag es
          # `v1.2.0` y el instalador sale como `..._1.2.0_x64-setup.exe`: usar
          # `github.ref_name` crudo en el glob de abajo no matchearia nada, y eso
          # falla recien en el ultimo paso, despues de compilar en release.
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Instalar dependencias del front
        run: npm ci

      # **Sin firma de código, a propósito.** Un certificado son cientos de
      # dólares al año y el gasto es un límite duro del proyecto; el costo es el
      # aviso "Windows protegió su PC" en la primera instalación, explicado en
      # `app/README.md`.
      #
      # **Y sin updater**: motor y app se numeran juntos, así que una versión
      # nueva incluye al motor -- y el updater sólo puede entregar el `.exe` de
      # la ventana. Entregaría medio producto. Ver el punto 17 del backlog.
      - name: Compilar el instalador
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cabina-${{ github.ref_name }}-nsis
          # **El glob lleva la version y no es `*.exe`.** El directorio del
          # bundle acumula compilaciones viejas: en local quedo un `_0.1.0_`
          # conviviendo con el nuevo, y con el comodin el artefacto tendria dos
          # instaladores y quien lo baje puede agarrar el que no es.
          # `if-no-files-found: error` cierra el otro lado: si el nombre cambia,
          # esto falla en vez de subir un zip vacio.
          path: app/src-tauri/target/release/bundle/nsis/*_${{ env.VERSION }}_*-setup.exe
          if-no-files-found: error

      # **La Release la publica `gh`, no una action de terceros.** Este job
      # tiene `contents: write`: darselo a codigo externo es superficie de
      # cadena de suministro que no hace falta: `gh` ya viene en el runner.
      #
      # El artefacto de arriba se deja igual. Es la red: si esto falla, el
      # instalador ya esta compilado y se publica a mano sin recompilar.
      - name: Publicar la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # **El cuerpo sale del mensaje del tag anotado.** Ahi ya se escribe
          # que trae la version; tener el texto en dos lugares los desincroniza.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
          titulo=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notas.md"

          # **El pie vive en un archivo del repo y no en un heredoc aca.**
          # `cat` copia bytes: escribir texto acentuado en un heredoc dentro de
          # un runner de Windows es exactamente como se corrompen los acentos, y
          # no hay forma de verificarlo sin publicar. De paso, cambiar el texto
          # no obliga a tocar el YAML.
          cat ../.github/pie-de-release.md >> "$RUNNER_TEMP/notas.md"

          exe=$(ls src-tauri/target/release/bundle/nsis/*_${VERSION}_*-setup.exe)
          echo "publicando $exe"
          gh release create "$GITHUB_REF_NAME" "$exe" --title "${titulo:-$GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notas.md"
