name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (pytest, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff -- imports y variables sin usar, nombres no definidos)
        run: ruff check .

      - name: Tests con cobertura (mínimo 80%, ver specs/mission.md)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  migraciones:
    name: Alembic contra Postgres + pgvector real
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sin_ruido
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuario -d sin_ruido"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://usuario:password@localhost:5432/sin_ruido
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias de producción
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar migraciones (falla si el autogenerado está roto)
        run: alembic upgrade head
