name: CI

on:
  push:
    # También la rama de trabajo: sin esto, nada se verifica hasta abrir el PR,
    # con todo el trabajo ya hecho. Los minutos son gratis, el repo es público.
    branches: [main, mejoras-post-1.0]
    # Filtro por **inclusión y no por exclusión**, a propósito.
    #
    # Lo obvio sería `paths-ignore: ['app/**']`, pero rompería una guarda real:
    # `tests/test_contrato_api.py` lee archivos de la app —los bindings, para
    # vigilar que el contrato no derive de lo que la app exige, y `CONTRATO.md`,
    # para que el documento y el diccionario no se separen—. Con `paths-ignore`,
    # alguien toca `tipos.rs`, se regeneran los bindings, y ese guardián no corre.
    #
    # Listadas por inclusión, esas dos rutas de la app quedan declaradas como lo
    # que son: parte del contrato del motor.
    #
    # `paths` va anidado dentro de cada evento. Como hermano de `push` GitHub lo
    # ignora en silencio, y la CI correría siempre creyendo estar filtrada.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements*.txt'
      - 'pytest.ini'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'
      - 'app/src/bindings/**'
      - 'app/CONTRATO.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements*.txt'
      - 'pytest.ini'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'
      - 'app/src/bindings/**'
      - 'app/CONTRATO.md'

concurrency:
  group: motor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (pytest, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff -- imports y variables sin usar, nombres no definidos)
        run: ruff check .

      - name: Tests con cobertura (mínimo 80%, ver specs/mission.md)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  migraciones:
    name: Alembic contra Postgres + pgvector real
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sin_ruido
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuario -d sin_ruido"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://usuario:password@localhost:5432/sin_ruido
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias de producción
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar migraciones (falla si el autogenerado está roto)
        run: alembic upgrade head
