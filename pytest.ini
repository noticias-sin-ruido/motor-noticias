[pytest]
# Directorio donde están los tests
testpaths = tests

# Patrones de archivos que pytest reconoce como tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbosidad y opciones por defecto
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personalizados
markers =
    db: pruebas de base de datos
    api: pruebas de endpoints
    integration: pruebas de integración
