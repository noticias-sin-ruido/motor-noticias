services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sin_ruido_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sin_ruido
    ports:
      - "5432:5432"
    volumes:
      - sin_ruido_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d sin_ruido"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sin_ruido_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # El .env local (fuera de Docker) apunta a localhost:5432 para
      # desarrollo sin contenedores; acá se pisa solo esta variable porque
      # dentro de la red de compose la app resuelve "db", no localhost.
      DATABASE_URL: postgresql+psycopg://usuario:password@db:5432/sin_ruido
    ports:
      # **Solo loopback.** `"8000:8000"` liga a 0.0.0.0, así que en un VPS con
      # IP pública publicaba la API entera a internet — y la API trae endpoints
      # que gastan plata (`/synthesize`), que hacen al motor golpear los feeds
      # con tu identidad (`/ingest`) y que le entregan la credencial de IA a un
      # host arbitrario (`POST /modelos`).
      #
      # Para exponerla de verdad: definí `API_TOKEN` y poné un proxy con TLS
      # adelante. Ver `src/auth.py`.
      - "127.0.0.1:8000:8000"
    # alembic upgrade head antes de uvicorn, en el mismo comando en vez de un
    # service `migrate` aparte: es idempotente (no-op si ya está al día) y
    # falla rápido y ruidoso si la migración está rota -- el contenedor no
    # arranca, que es la señal correcta. Un service separado es más "puro"
    # pero es una segunda definición de servicio para lo mismo; en un VPS
    # único no compra nada.
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    # **Acá se persisten los logs, y acá se los acota.** El motor escribe a
    # stdout (ver `src/logging_config.py`) y Docker se encarga del resto — pero
    # el driver `json-file` por defecto **no rota nunca**: el archivo crece hasta
    # llenar el disco del VPS, y un disco lleno tira abajo también a Postgres.
    # Deja de ser hipotético desde que el motor loguea en INFO.
    #
    # 10 MB x 5 archivos = 50 MB de techo. Medido sobre corridas reales en INFO:
    # un ciclo con trabajo (11 síntesis) deja ~4,7 KB y uno sin nada que hacer
    # ~1 KB, así que a 96 ciclos por día el techo son más de tres meses de
    # historia. Sobra para diagnosticar algo que pasó el fin de semana, que es
    # para lo que se lee un log viejo.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sin_ruido_pgdata:
