[package]
name = "cabina"
version = "0.1.0"
description = "La cabina del motor de Sin Ruido"
authors = ["Fernando Garcia"]
edition = "2021"

[lib]
# El sufijo `_lib` parece redundante pero hace falta: sin él, en Windows el
# nombre de la librería choca con el del binario.
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "cabina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# El token del operador va al Credential Manager de Windows, no a un archivo
# nuestro ni al `.env` del motor. `keyring` abstrae el almacén nativo: en
# Windows es Credential Manager, y la misma llamada mapea a Keychain y a
# Secret Service el día que esto deje de ser solo Windows.
keyring = { version = "3", features = ["windows-native"] }

# **Todo el HTTP sale de acá y no del webview.** Con `fetch` desde React el
# token tendría que viajar al JavaScript para poder mandarlo, y entonces
# cualquier problema en la ventana lo alcanza. Haciéndolo desde Rust, el token
# sale del Credential Manager y va directo al header sin pasar por el front.
# De paso desaparece el CORS.
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
